services:
  tournaments:
    # Production pulls the image built in Actions; local `docker compose build` still works.
    image: ${TOURNAMENT_IMAGE:-ghcr.io/duelingdomain/tournament-software:main}
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3400:3000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_PATH: /app/data/tournaments.sqlite
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      DD_APP_URL: ${DD_APP_URL:?Set DD_APP_URL}
      DD_BRIDGE_SECRET: ${DD_BRIDGE_SECRET:?Set DD_BRIDGE_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      CREATE_CODE: ${CREATE_CODE:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
